name: promote

# Staging is published and tested; you validate it by accepting this run:
# Actions > promote > Run workflow > review > Accept. Accepting merges staging
# into main and publishes https://hoolala.hg-labs.io, all in this one run.
# Its push to main does not retrigger deploy-production.yml (GitHub starts no
# new run from a GITHUB_TOKEN push), so production deploys exactly once.
# One-time setup: repo Settings > Environments > `acceptance`, with yourself
# as required reviewer. Needs the CLOUDFLARE_API_TOKEN secret (and
# CLOUDFLARE_ACCOUNT_ID) for the production deploy.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  smoke-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke.mjs https://staging.hoolala.hg-labs.io

  accept:
    runs-on: ubuntu-latest
    needs: smoke-staging
    environment:
      name: acceptance
      url: https://staging.hoolala.hg-labs.io
    steps:
      - run: echo "Staging accepted. Releasing to production."

  release:
    runs-on: ubuntu-latest
    needs: accept
    environment:
      name: production
      url: https://hoolala.hg-labs.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git config user.name "hoolala-release"
          git config user.email "release@hoolala.hg-labs.io"
          git merge origin/staging --no-ff -m "Promote staging to production"
          git push origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/smoke.mjs https://hoolala.hg-labs.io
