<!-- @dsCard group="Say it" height=300 subtitle="A voice note understood, before anything happens" -->
<div class="lcd" style="padding:16px;display:flex;flex-direction:column;gap:12px">
  <div class="lcd-kicker">Say it</div>
  <div class="lcd-kicker">You said:</div>
  <div class="lcd-me">"Anyone free for coffee Thursday? Somewhere near Ouchy."</div>
  <div class="lcd-small"><span class="lcd-loader" aria-hidden="true"><span class="on"></span><span class="on"></span><span></span></span> Checking what friends shared...</div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="lcd-key" type="button">Fix it</button><button class="lcd-key" type="button">Cancel</button></div>
  <p class="lcd-small" style="margin:0">Heard, then forgotten. We don't keep your voice note.</p>
</div>
