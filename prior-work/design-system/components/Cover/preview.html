<!-- @dsCard height=288 -->
<style>
.cv{position:relative;width:960px;height:288px;background:var(--surround-bg);overflow:hidden}
.cv svg{position:absolute;left:0;top:0}
.c-bg{fill:var(--lcd-bg)}.c-surf{fill:var(--lcd-surface)}.c-sunk{fill:var(--lcd-sunken)}.c-ink{fill:var(--lcd-ink)}.c-shell{fill:var(--shell-bg)}
.cv-text{position:absolute;left:40px;bottom:40px;max-width:420px}
.cv-name{font-family:var(--font-display);font-weight:700;font-size:64px;line-height:.95;letter-spacing:-.03em;color:var(--lcd-ink);text-transform:uppercase}
.cv-tag{margin-top:12px;font-family:var(--font-body);font-size:14px;color:var(--lcd-ink-secondary)}
</style>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" shape-rendering="crispEdges" aria-hidden="true">
    <!-- blocks: shell-bg slab 240x320 (radius-control), lcd-bg screen 200x216, lcd-surface 160x96, lcd-sunken 160x112, lcd-ink bar 192x48 -->
    <!-- arrangement: a strip of squared slabs right of x=480, the shell bleeding off top and bottom like a handset held up -->
    <!-- pattern: the pixel grid at space-2 (8px) as a terrain of hills and a pine cut in lcd-ink, chosen because one-bit pixel drawings and an 8px grid are the system's signature -->
    <!-- scales: steps space-2 8, space-5 24, space-6 32; corners radius-control 2 -->
    <rect class="c-shell" x="504" y="-16" width="240" height="320" rx="2"></rect>
    <rect class="c-bg" x="524" y="32" width="200" height="216" rx="2"></rect>
    <rect class="c-surf" x="768" y="24" width="160" height="96" rx="2"></rect>
    <rect class="c-sunk" x="768" y="144" width="160" height="112" rx="2"></rect>
    <rect class="c-ink" x="536" y="56" width="176" height="40" rx="2"></rect>
    <path class="c-ink" d="M524 248V232H548V224H564V216H580V224H596V208H612V200H628V208H644V216H660V224H684V216H700V224H724V248Z"></path>
    <rect class="c-ink" x="680" y="176" width="8" height="40"></rect><rect class="c-ink" x="672" y="184" width="24" height="8"></rect><rect class="c-ink" x="668" y="196" width="32" height="8"></rect>
    <rect class="c-ink" x="560" y="120" width="8" height="8"></rect><rect class="c-ink" x="552" y="128" width="24" height="8"></rect><rect class="c-ink" x="560" y="136" width="8" height="8"></rect>
    <rect class="c-ink" x="840" y="48" width="16" height="40"></rect><rect class="c-ink" x="840" y="96" width="16" height="16"></rect>
    <path class="c-ink" d="M768 256V240H792V232H816V224H840V232H872V240H904V248H928V256Z"></path>
  </svg>
  <div class="cv-text">
    <div class="cv-name">Hoolala!<br>Mono LCD</div>
    <div class="cv-tag">You never know until you go.</div>
  </div>
</div>
<script></script>
