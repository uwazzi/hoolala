<!-- @dsCard group="Small talk" height=330 subtitle="Guess before, plot twist after" -->
<div class="lcd" style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="lcd-kicker">Mission / before you go</div>
    <h2 class="lcd-title">Queue comment</h2>
    <div class="lcd-block" style="align-self:flex-start">How do you think it'll go?</div>
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font:700 16px var(--font-display)">
      <span class="lcd-key" style="min-height:40px">1</span><span class="lcd-key" style="min-height:40px">2</span><span class="lcd-key lcd-key--primary" style="min-height:40px">3</span><span class="lcd-key" style="min-height:40px">4</span><span class="lcd-key" style="min-height:40px">5</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="lcd-kicker">Debrief</div>
    <h2 class="lcd-title">Plot twist!</h2>
    <p style="margin:0">That beat your guess by 5.</p>
    <div class="lcd-block"><div class="lcd-kicker">Guess 3 / Actual 8</div><div class="lcd-progress"><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="lcd-progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span></div></div>
    <span class="lcd-badge" style="align-self:flex-start;background:var(--lcd-ink);color:var(--lcd-selected-ink)">+1 courage</span>
  </div>
</div>
