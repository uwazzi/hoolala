<!-- @dsCard group="Content" height=420 subtitle="Leave a note: pick an activity, then review" -->
<div class="lcd" style="padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px">
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="lcd-kicker">Leave a note / an invitation to go out</div>
    <h2 class="lcd-title">What shall we do?</h2>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <button class="lcd-key" type="button" style="justify-content:flex-start;min-height:56px">Board games</button>
      <button class="lcd-key" type="button" style="justify-content:flex-start;min-height:56px">Card games</button>
      <button class="lcd-key lcd-key--primary" type="button" style="justify-content:flex-start;min-height:56px">Grab a coffee</button>
      <button class="lcd-key" type="button" style="justify-content:flex-start;min-height:56px">Walk in the park</button>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="lcd-kicker">Check before sending</div>
    <h2 class="lcd-title">Send this invitation?</h2>
    <div class="lcd-block"><div style="font:700 18px var(--font-display);text-transform:uppercase">Grab a coffee</div><div class="lcd-kicker">Sat 24 Oct / 10:30 / The café on the corner</div><hr class="lcd-rule"><p style="margin:0">Fancy a coffee? An hour, no phones, proper catch-up.</p><div class="lcd-small">To: close circle (5)</div></div>
    <button class="lcd-key lcd-key--primary" type="button">Yes, send it</button>
  </div>
</div>
<script></script>
