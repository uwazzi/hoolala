# Hoolala! Worker config. Owner steps before the first deploy:
#   wrangler d1 create hoolala        -> paste database_id below
#   wrangler kv namespace create SESSIONS -> paste id below
#   wrangler secret put TELEGRAM_BOT_TOKEN (and the other secrets; never in this file)
name = "hoolala"
main = "src/worker.ts"
compatibility_date = "2026-10-27"

[assets]
directory = "public/"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "hoolala"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "src/db/migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["*/5 * * * *"]

[vars]
LLM_ENABLED = "false"
PLACES_PROVIDER = "osm"
